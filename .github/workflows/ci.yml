name: CI (Lint, Build, Test & Checks)

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Branch Isolation
        if: github.event_name == 'pull_request'
        run: node .agents/scripts/check-branch-isolation.mjs --branch "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test

      - name: Check for Japanese in src/
        run: node .agents/scripts/check-no-japanese.mjs --all
