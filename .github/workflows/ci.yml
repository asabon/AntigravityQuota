name: CI (Lint, Build, Test & Checks)

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Verify Branch Isolation
        if: matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request'
        run: node .agents/scripts/check-branch-isolation.mjs --branch "${{ github.head_ref }}" --base "origin/${{ github.base_ref }}"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        if: matrix.os == 'ubuntu-latest'
        run: npm run lint

      - name: Compile TypeScript
        run: npm run compile

      - name: Run Unit Tests
        run: npm run test

      - name: Verify VSIX Packaging
        if: matrix.os == 'ubuntu-latest'
        run: npm run node:vsix:package

      - name: Check for Japanese in src/
        if: matrix.os == 'ubuntu-latest'
        run: node .agents/scripts/check-no-japanese.mjs --all
